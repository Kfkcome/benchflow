name: harvey-lab
description: "Legal Agent Benchmark (Harvey LAB) \u2014 1,251 realistic legal tasks\
  \ across\n24 practice areas. Tasks ship instructions, source documents, and a\n\
  rubric of pass/fail criteria graded by an LLM judge (all-pass scoring).\n"
upstream:
  url: https://github.com/harveyai/harvey-labs
  branch: main
  pinned_commit: 7daf1ac289b5fb1a8cacc0616651097acd51799b
license: MIT
authors:
- name: Harvey AI
  email: labs@harvey.ai
tasks:
  count: 1251
  practice_areas: 24
  work_types:
  - analyze
  - draft
  - review
  - research
  criteria_per_task:
    min: 23
    max: 194
    median: ~60
conversion:
  script: benchflow.py
  source_format: task.json + documents/
  has_oracle_solutions: false
  splits:
    full:
      selector: all
      count: 1251
    parity:
      selector: PARITY_SUBSET
      count: 5
verification:
  method: llm-as-judge
  judge_model: gemini-3.1-flash-lite-preview
  judge_temperature: 0.0
  reward: all-pass
  diagnostics:
  - criterion_pass_rate
parity:
  protocol: "symmetric runs, mean \xB1 sample SEM, match = max(A) >= min(B) AND max(B)\
    \ >= min(A)"
  artifact: parity_experiment.json
  hf_mirror: https://huggingface.co/datasets/benchflow/benchmarks
  structural:
    tasks_tested: 1251
    passed: 1251
  agent_runs:
    agent_model: gemini-3.1-flash-lite-preview
    judge_model: gemini-3.1-flash-lite-preview
    runs_per_side: 3
    tasks_tested: 5
    metric_match_rate:
      all_pass_reward: 5/5
      criterion_pass_rate: 3/5
      criterion_pass_rate_failures:
      - corporate-ma/analyze-cim-deal-teaser/scenario-01 (consistent 1-criterion gap,
        deterministic at temp=0)
      - employment-labor/draft-workplace-policy-memorandum (consistent 1-criterion
        gap, deterministic at temp=0)
